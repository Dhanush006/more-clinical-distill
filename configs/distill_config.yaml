# ============================================================
# configs/distill_config.yaml
#
# Configuration for distillation training.
# Teacher: MoRE MultiModal (frozen)
# Student: MobileNetV3-Small (single-lead ECG)
# ============================================================

# ── Teacher ──────────────────────────────────────────────────
teacher:
  checkpoint:       outputs/more_pretrained.pth
  # All 3 modality embeddings pre-cached (preferred over embedding_cache)
  triplet_cache:    data/processed/teacher_triplet.npz
  # Legacy ECG-only embeddings (fallback when triplet_cache absent)
  embedding_cache:  data/processed/teacher_ecg_embeddings.npy
  study_id_cache:   data/processed/teacher_ecg_study_ids.npy

# ── Student ───────────────────────────────────────────────────
student:
  architecture:        mobilenetv3_small_100
  ecg_num_classes:     10         # ECG rhythm classes (primary head)
  pulm_num_classes:    4          # Pulmonary pathology classes (secondary head)
  embedding_dim:       128        # must match teacher ECG projector output dim
  signal_length:       1000       # samples at 100 Hz (after 500→100 Hz downsample)
  input_lead:          0          # 0=Lead I, 1=Lead II, 7=V2 (0-indexed)
  pretrained_backbone: false      # set true to use ImageNet-pretrained MobileNetV3
  ecg_class_names:
    - Normal
    - Sinus bradycardia
    - Sinus tachycardia
    - Atrial fibrillation
    - LBBB
    - RBBB
    - ST elevation MI
    - ST ischemia
    - AV block
    - LVH
  pulm_class_names:
    - Atelectasis
    - Cardiomegaly
    - Edema
    - Pleural Effusion

# ── Data ─────────────────────────────────────────────────────
data:
  train_npy:        data/processed/more_train.npy
  val_npy:          data/processed/more_val.npy
  test_npy:         data/processed/more_test.npy
  # Pre-computed (N, 1000, 12) float32 cache of all ECG leads at 100 Hz.
  # Built by scripts/cache_ecg_signals.py — eliminates per-batch wfdb.rdsamp
  # + scipy.resample overhead during training (~30x epoch speedup).
  signal_cache:     data/processed/ecg_signals_100hz.npy
  signal_id_cache:  data/processed/ecg_signal_ids.npy

# ── Loss weights (legacy, used by A0 baseline only) ──────────
# L = alpha_ecg*L_ecg_task + alpha_pulm*L_pulm_task + gamma*L_align
loss_weights:
  alpha_ecg:  1.0   # ECG rhythm BCE (primary head)
  alpha_pulm: 0.5   # pulmonary BCE  (secondary head, learned via distillation)
  gamma:      0.5   # embedding cosine alignment to teacher

# ── ResidualLossGate ──────────────────────────────────────────
loss_gate:
  enabled:    true                      # set false for uniform-weight ablations
  lambda_h:   0.3                       # entropy reg weight (was 0.1 — too weak,
                                        # gate collapsed onto degenerate KL term)
  hidden_dim: 64                        # MLP hidden layer size
  modalities: [ecg, cxr, text]          # which teacher embeddings to use

# ── Training ─────────────────────────────────────────────────
training:
  epochs:        50          # was 100; signal cache makes ~50 epochs sufficient
  batch_size:    256         # was 64; signal cache + persistent_workers fits fine
  num_workers:   8           # was 4; bumped with bigger batch
  learning_rate: 3.0e-4      # scaled with batch size (256/64 = 4×, sqrt-rule → ~2×; round to 3e-4)
  weight_decay:  0.01
  t_0:           10
  eta_min:       1.0e-6
  kl_temperature: 4.0    # retained for backward-compat (KL term currently disabled)
  early_stopping_patience: 10

# ── Outputs ──────────────────────────────────────────────────
outputs:
  checkpoint_dir: outputs/distill
  log_dir:        logs/distill
