# ============================================================
# configs/smoke_test.yaml
#
# Configuration for the smoke test run.
# Validates the full forward pass on a tiny subset before
# committing to a full training job.
# ============================================================

# ── Data ─────────────────────────────────────────────────────
data_path: data/processed/smoke_test.npy
n_samples: 50        # number of subjects to include in smoke dataset

# ── Training ─────────────────────────────────────────────────
batch_size: 4
num_workers: 0       # 0 = main process only (easier to debug)
epochs: 1
accumulation_steps: 1

# ── Optimiser ────────────────────────────────────────────────
learning_rate: 3.0e-5
weight_decay: 0.1
eta_min: 3.0e-6
t_0: 10

# ── Loss ─────────────────────────────────────────────────────
temperature_initial: 0.1
learnable_temp: 0.02

# ── Model ────────────────────────────────────────────────────
# Path to RoBERTa-base-PM-M3 (set MORE_ROBERTA_PATH env var or
# place model at the default path below)
roberta_path: data/RoBERTa-base-PM-M3/RoBERTa-base-PM-M3-hf

# ── Outputs ──────────────────────────────────────────────────
output_dir: outputs/smoke_test
log_dir: logs/smoke_test

# ── Early stopping ────────────────────────────────────────────
patience: 5
